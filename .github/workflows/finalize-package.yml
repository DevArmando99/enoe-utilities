name: Finalize package structure

on:
  push:
    branches:
      - package-structure-v0.1
    paths:
      - ".package_payload/**"
      - ".github/workflows/finalize-package.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: package-structure-v0.1
          fetch-depth: 0

      - name: Reconstruct package files
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .package_payload/piece_000.txt \
            .package_payload/piece_001.txt \
            .package_payload/piece_002.txt \
            .package_payload/piece_003.txt \
            .package_payload/piece_004.txt \
            .package_payload/piece_005.txt \
            .package_payload/piece_006.txt \
            .package_payload/piece_007.txt \
            .package_payload/piece_008.txt \
            .package_payload/piece_009_0.txt \
            .package_payload/piece_009_1.txt \
            .package_payload/piece_010.txt \
            .package_payload/piece_011.txt \
            .package_payload/piece_012.txt \
            .package_payload/piece_013.txt \
            .package_payload/piece_014.txt \
            .package_payload/piece_015.txt \
            .package_payload/piece_016.txt \
            | base64 --decode > /tmp/enoe-package.tar.xz

          echo "3d3267a7361733058a93ad15fb4f1347b853b4e320b0db7006a547df273489ca  /tmp/enoe-package.tar.xz" \
            | sha256sum --check --strict

          tar -xJf /tmp/enoe-package.tar.xz -C .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf .package_payload

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate syntax and imports
        run: |
          python -m compileall -q enoe_utilities examples
          python -c "from enoe_utilities import get_time_series, build_analysis_dataset, compute_pl_time_series; print('Import test: OK')"
          python -c "import enoe_utilities; print(enoe_utilities.__all__)"

      - name: Commit finalized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize package structure v0.1"
            git push origin HEAD:package-structure-v0.1
          fi
